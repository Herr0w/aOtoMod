# Eklenti durumu
enabled: true

permissions:
  # Bypass izni
  bypass: "automod.bypass"
  # Yenileme izni
  reload: "automod.reload"
  # Unmute izni
  unmute: "automod.unmute"

filter:
  # Sembol koruması
  smart-normalization: true
  # Leet koruması
  leet-normalization: true
  # İzinli kelimeler
  whitelist:
    - "ampul"
    - "kamp"
    - "robot"
  # Level 1 kelimeleri
  level-1:
    - "salak"
    - "aptal"
    - "gerizekali"
    - "geri zekalı"
    - "mal"
    - "malsın"
    - "ezik"
    - "ahmak"
    - "dangalak"
    - "beyinsiz"
    - "boş yapma"
    - "çöp"
    - "çöpsün"
    - "noob"
    - "nub"
    - "bot"
    - "beceriksiz"
    - "yeteneksiz"
    - "loser"
    - "velet"
    - "çocuksun"
    - "ağlama"
    - "kudur"
    - "kudurmuş"
    - "eziksin"
    - "komik"
    - "zavallı"
    - "boşsun"
    - "boş herif"
    - "boş adam"
  # Level 2 kelimeleri
  level-2:
    - "oç"
    - "oc"
    - "piç"
    - "pıç"
    - "pezevenk"
    - "yavşak"
    - "yavsak"
    - "şerefsiz"
    - "serefsiz"
    - "haysiyetsiz"
    - "karaktersiz"
    - "adi"
    - "ibne"
    - "it"
    - "köpek"
    - "şıllık"
    - "serefsizin teki"
    - "soysuz"
    - "namussuz"
    - "alçak"
    - "aşağılık"
    - "aşağılık herif"
    - "aşağılık insan"
    - "şerefsizin evladı"
    - "kansız"
    - "satılmış"
    - "rezil"
    - "utanmaz"
    - "yüzsüz"
    - "şeref yoksunu"
    - "karaktersiz herif"
    - "pislik"
    - "mahlukat"
    - "gerzek"
    - "şapşal"
  # Level 3 kelimeleri
  level-3:
    - "amk"
    - "aq"
    - "a.q"
    - "amq"
    - "mk"
    - "mq"
    - "sik"
    - "siktir"
    - "siktir git"
    - "siktirgit"
    - "sikeyim"
    - "siktiğimin"
    - "amına"
    - "amina"
    - "amını"
    - "amini"
    - "amcık"
    - "amcik"
    - "yarak"
    - "yarrak"
    - "taşşak"
    - "tassak"
    - "orospu"
    - "orospu çocuğu"
    - "orospu cocugu"
    - "orospucocuğu"
    - "orospucocugu"
    - "göt"
    - "got"
    - "götveren"
    - "gotveren"
    - "götlek"
    - "gotlek"
    - "ananı"
    - "anani"
    - "anana"
